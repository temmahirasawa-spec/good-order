<title>（資料の名前・2〜4語）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Noto+Sans+JP:wght@500;700&display=swap">
<style>
/* ── 色と書体はここだけ差し替える（題材のブランド色・書体を使う）── */
:root{--accent:#5E6B4A;--accent-deep:#444D35;--accent-subtle:#E7E9E5;--ink:#1A1A1A;--sub:#5F6258;--t3:#8E9187;--line:#DCDED6;--bg:#F3F3F0;--paper:#FFFFFF;--old:#FAC03D;--jp:'Noto Sans JP',system-ui,sans-serif;--en:Barlow,'Noto Sans JP',sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#97A67F;--accent-deep:#B9C6A4;--accent-subtle:#2C3126;--ink:#F2F2EE;--sub:#B9BCB2;--t3:#82857C;--line:#3A3D35;--bg:#1C1E19;--paper:#262923}}
:root[data-theme="dark"]{--accent:#97A67F;--accent-deep:#B9C6A4;--accent-subtle:#2C3126;--ink:#F2F2EE;--sub:#B9BCB2;--t3:#82857C;--line:#3A3D35;--bg:#1C1E19;--paper:#262923}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.8 var(--jp)}
.wrap{max-width:1040px;margin:0 auto;padding:40px 24px 96px}
/* ヘッダー */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-bottom:28px;border-bottom:2px solid var(--ink)}
.eyebrow{font:500 11px/1.4 var(--jp);letter-spacing:.06em;color:var(--sub)}
h1{font:500 44px/1.05 var(--en);margin:6px 0 4px;letter-spacing:-.01em;text-wrap:balance}
.jp{font:700 13px var(--jp);color:var(--sub);letter-spacing:.04em}
.meta{font:600 13px var(--en);color:var(--sub);text-align:right;line-height:1.6;font-variant-numeric:tabular-nums}.meta b{display:block;font:600 20px var(--en);color:var(--ink)}
/* サマリー */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0 0}
.sum{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px}
.sum .n{font:600 13px var(--en);color:var(--accent);letter-spacing:.08em}.sum .t{font:700 16px/1.4 var(--jp)}.sum p{margin:0;font-size:13px;color:var(--sub);line-height:1.6}
/* セクション */
section{margin-top:56px}
.sh{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}.sh .eye{font:500 11px var(--jp);letter-spacing:.06em;color:var(--sub)}.sh .en{font:500 34px/1.1 var(--en);letter-spacing:-.01em}.sh .ja{font:700 13px var(--jp);color:var(--sub)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.prose{max-width:62ch}.prose p{margin:0 0 12px}.prose ul{margin:0 0 12px;padding-left:20px}.prose li{margin:4px 0}
.callout{border-left:3px solid var(--accent);background:var(--accent-subtle);padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0}.callout b{color:var(--accent-deep)}
/* 画面カード */
.ba{display:grid;grid-template-columns:1fr 1fr;gap:16px}.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.shot{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0}
.shot .lab{display:flex;align-items:center;gap:8px;padding:10px 14px;font:700 12px var(--jp);border-bottom:1px solid var(--line)}
.shot .lab span{font:600 10px var(--en);letter-spacing:.1em;padding:2px 7px;border-radius:999px;background:var(--accent);color:#fff}.shot .lab span.old{background:var(--old);color:#1A1A1A}
.shot .im{max-height:560px;overflow-y:auto;background:var(--bg)}.shot img{display:block;width:100%}
.shot .cap{padding:10px 14px;font-size:12px;color:var(--sub);line-height:1.6;border-top:1px solid var(--line)}
/* 色チップ・表・次の順番 */
.pal{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px}.chip{display:flex;flex-direction:column;gap:4px;width:96px;font:600 11px var(--en);color:var(--sub)}.chip i{display:block;height:44px;border-radius:8px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-weight:700;color:var(--sub);font-size:12px}tr:last-child td{border-bottom:0}
.next{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.next span{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}.next i{color:var(--t3);font-style:normal}
.foot{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--t3)}
@media (max-width:760px){.wrap{padding:24px 16px 64px}.hero,.row,.ba,.summary,.shots{grid-template-columns:1fr}.meta{text-align:left}h1{font-size:34px}.sh .en{font-size:28px}.shot .im{max-height:480px}}
</style>
<div class="wrap">
<header class="hero"><div><div class="eyebrow">案件名 — プロダクト名</div><h1>English Title</h1><div class="jp">日本語の一言（何の資料か）</div></div><div class="meta">2026.MM.DD<b>3 items</b>作成者</div></header>

<div class="summary">

<div class="sum"><div class="n">03 / LABEL</div><div class="t">見出し</div><p>結論。</p></div>
</div>

</section>
<div class="foot">作成者 ／ 参照した資料</div>
</div>
